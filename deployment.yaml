apiVersion: apps/v1
kind: Deployment
metadata:
  name: image-compressor
  labels:
    app: image-compressor
spec:
  replicas: 2
  selector:
    matchLabels:
      app: image-compressor
  template:
    metadata:
      labels:
        app: image-compressor
    spec:
      containers:
        - name: image-compressor
          # Replace DOCKERHUB_USERNAME before manually deploying this file.
          image: inshirah1243/image-compressor:latest
          ports:
            - containerPort: 5000
          env:
            - name: SECRET_KEY
              value: change-this-to-a-long-random-secret
